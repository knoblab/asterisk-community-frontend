    />

    <!-- Asta Sans & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />

    <!--
      asterisk* cnsh.space 공통 디자인 토큰 (Black #000000 & White #F7F6F2)
    -->
    <style>
      :root {
        --eta-red: #000000;
        --eta-red-strong: #000000;
        --eta-red-soft: #eceee7;
        --eta-ink: #000000;
        --eta-muted: #6b6c67;
        --eta-line: #d1d2ca;
        --eta-line-light: #e8e9e2;
        --eta-paper: #f7f6f2;
        --eta-surface: rgba(255, 255, 255, 0.98);
        --eta-shadow:
          0 1px 0 #ffffff inset,
          0 2px 0 rgba(0, 0, 0, 0.08),
          0 14px 30px rgba(0, 0, 0, 0.05);

        font-family:
          "Asta Sans",
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--eta-ink);
        background: var(--eta-paper);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--eta-paper);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--eta-ink);
        background-color: var(--eta-paper);
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        color: inherit;
      }

      button,
      [role="button"],
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        border-radius: 4px;
      }

      input,
      select,
      textarea {
        border-radius: 4px;
      }

      a {
        color: inherit;
      }

      ::selection {
        color: #f7f6f2;
        background: #000000;
      }

      :focus-visible {
        outline: 2px solid #000000;
        outline-offset: 2px;
      }

      #root {
        min-height: 100vh;
      }

      .app-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app-loading__panel {
        width: min(420px, 100%);
        padding: 30px;
        border: 1px solid var(--eta-line);
        border-radius: 8px;
        background: var(--eta-surface);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }

      .app-loading__label {
        margin: 0 0 8px;
        color: #000000;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .app-loading__title {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.03em;
        font-weight: 700;
        color: #000000;
      }

      @media (max-width: 640px) {
        .app-loading__panel {
          padding: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-loading" aria-live="polite">
        <div class="app-loading__panel">
          <p class="app-loading__label">ASTERISK* CNSH.SPACE</p>
          <p class="app-loading__title">asterisk* cnsh.space</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
