<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#06050a"/>
    </linearGradient>
    
    <radialGradient id="glow-red" cx="1000" cy="100" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ad1d1d" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#941a1a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-secondary" cx="150" cy="530" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ad1d1d" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#71717a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-icon" cx="180" cy="235" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ad1d1d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ad1d1d" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Signature Red Q-Lock Gradients & Filters -->
    <linearGradient id="red-grad" x1="116" y1="90" x2="410" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c21f1f"/>
      <stop offset="50%" stop-color="#ad1d1d"/>
      <stop offset="100%" stop-color="#941a1a"/>
    </linearGradient>
    <filter id="q-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ad1d1d" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1000" cy="100" r="450" fill="url(#glow-red)"/>
  <circle cx="150" cy="530" r="380" fill="url(#glow-secondary)"/>
  
  <!-- Outer Bevel Frame -->
  <rect width="1196" height="626" x="2" y="2" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <rect width="1194" height="624" x="3" y="3" rx="23" fill="none" stroke="rgba(0, 0, 0, 0.5)" stroke-width="1"/>

  <!-- Left Side: Ultra-Simple Signature Red Q-Lock Logo (Scale 0.44 -> 225x225, positioned at 70, 120) -->
  <circle cx="182" cy="232" r="160" fill="url(#glow-icon)"/>
  <g transform="translate(70, 120) scale(0.44)">
    <g filter="url(#q-shadow)">
      <path d="M 370 310 L 420 395 C 424 402 416 410 408 405 L 300 364 A 140 140 0 1 1 370 310 Z" fill="url(#red-grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g fill="#09090b">
      <rect x="216" y="220" width="80" height="64" rx="14"/>
      <path d="M 236 220 V 192 A 20 20 0 0 1 276 192 V 220" fill="none" stroke="#09090b" stroke-width="16" stroke-linecap="round"/>
    </g>
    <circle cx="256" cy="246" r="8" fill="#ad1d1d"/>
    <rect x="253" y="246" width="6" height="16" rx="3" fill="#ad1d1d"/>
  </g>

  <!-- Main Typography -->
  <text x="310" y="215" font-family="'Pretendard Variable', Pretendard, Inter, -apple-system, sans-serif" font-weight="800" font-size="76" fill="#ffffff" letter-spacing="-1.5">Knoblab Chat</text>
  
  <!-- Sleek Version / E2E Pill in Signature Red -->
  <rect x="670" y="165" width="186" height="42" rx="21" fill="rgba(173, 29, 29, 0.18)" stroke="#ad1d1d" stroke-width="1.5"/>
  <text x="763" y="192" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="15" fill="#fef2f2" text-anchor="middle" letter-spacing="1">E2E ENCRYPTED</text>

  <!-- Tagline -->
  <text x="310" y="280" font-family="'Pretendard Variable', Pretendard, Inter, -apple-system, sans-serif" font-weight="500" font-size="34" fill="#e4e4e7">End-to-End Encrypted Messenger</text>
  
  <!-- Sub-description -->
  <text x="310" y="335" font-family="'Pretendard Variable', Pretendard, Inter, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#a1a1aa">Secure Matrix Protocol • Google Identity Sync • Zero-Knowledge</text>

  <!-- Decorative Right-Side Network Graphic in Signature Red -->
  <g opacity="0.8">
    <line x1="940" y1="175" x2="1050" y2="245" stroke="rgba(173, 29, 29, 0.4)" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="1050" y1="245" x2="1000" y2="355" stroke="rgba(173, 29, 29, 0.4)" stroke-width="2"/>
    <line x1="1000" y1="355" x2="900" y2="305" stroke="rgba(173, 29, 29, 0.4)" stroke-width="2"/>
    <line x1="900" y1="305" x2="940" y2="175" stroke="rgba(173, 29, 29, 0.4)" stroke-width="2"/>
    <line x1="1050" y1="245" x2="1110" y2="295" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    
    <circle cx="940" cy="175" r="16" fill="rgba(173, 29, 29, 0.2)" stroke="#ad1d1d" stroke-width="2"/>
    <circle cx="940" cy="175" r="6" fill="#ad1d1d"/>
    
    <circle cx="1050" cy="245" r="22" fill="rgba(173, 29, 29, 0.2)" stroke="#c21f1f" stroke-width="2"/>
    <circle cx="1050" cy="245" r="8" fill="#c21f1f"/>
    
    <circle cx="1000" cy="355" r="18" fill="rgba(173, 29, 29, 0.2)" stroke="#ad1d1d" stroke-width="2"/>
    <circle cx="1000" cy="355" r="7" fill="#ad1d1d"/>
    
    <circle cx="900" cy="305" r="14" fill="rgba(255, 255, 255, 0.1)" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="900" cy="305" r="5" fill="#ffffff"/>
    
    <circle cx="1110" cy="295" r="14" fill="rgba(173, 29, 29, 0.2)" stroke="#ad1d1d" stroke-width="1.5"/>
    <circle cx="1110" cy="295" r="5" fill="#ad1d1d"/>
  </g>

  <!-- Bottom Feature Bar / Cards in Signature Red -->
  <rect x="88" y="455" width="320" height="74" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="138" cy="492" r="22" fill="rgba(173, 29, 29, 0.2)" stroke="rgba(173, 29, 29, 0.4)" stroke-width="1"/>
  <text x="138" y="499" font-size="20" text-anchor="middle">🔒</text>
  <text x="176" y="499" font-family="'Pretendard Variable', Pretendard, Inter, sans-serif" font-weight="600" font-size="20" fill="#e4e4e7">Matrix Protocol</text>

  <rect x="432" y="455" width="340" height="74" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="482" cy="492" r="22" fill="rgba(173, 29, 29, 0.2)" stroke="rgba(173, 29, 29, 0.4)" stroke-width="1"/>
  <text x="482" y="499" font-size="20" text-anchor="middle">⚡</text>
  <text x="520" y="499" font-family="'Pretendard Variable', Pretendard, Inter, sans-serif" font-weight="600" font-size="20" fill="#e4e4e7">Real-Time Messaging</text>

  <rect x="796" y="455" width="316" height="74" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="846" cy="492" r="22" fill="rgba(173, 29, 29, 0.2)" stroke="rgba(173, 29, 29, 0.4)" stroke-width="1"/>
  <text x="846" y="499" font-size="20" text-anchor="middle">🔑</text>
  <text x="884" y="499" font-family="'Pretendard Variable', Pretendard, Inter, sans-serif" font-weight="600" font-size="20" fill="#e4e4e7">Google Identity</text>
</svg>
